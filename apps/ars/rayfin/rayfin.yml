id: app-ionova-ai-lab-ars
name: app-ionova-ai-lab-ars
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
      externalEntraExchange: true
    password:
      enabled: false
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
  data:
    enabled: true
    path: packages/data
    buildCommand: npm run build
    dialect: mssql
  staticHosting:
    enabled: true
    path: packages/frontend
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
    embedded:
      only: false
  functions:
    enabled: true
    auth:
      type: application
    path: packages/functions
    buildCommand: npm run build
  storage:
    enabled: false
secrets:
  - name: IONOVA_FOUNDRY_CLIENT_SECRET
    description: Client secret of the Foundry-tenant service principal (D-03a)
  - name: IONOVA_RUNTIME_CONFIG
    description: ioNova non-secret runtime configuration (see docs/DECISIONS.md D-50)
